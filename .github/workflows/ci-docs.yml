name: ci-docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-docs.yml'

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile=false

      - name: Audit JS deps
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Build (Next.js static export → apps/docs/out)
        run: pnpm --filter @sagewai/docs build

      - name: Verify out/ is populated
        working-directory: apps/docs
        run: |
          if [ ! -d out ] || [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::apps/docs/out is missing or empty"
            exit 1
          fi
          echo "out/ contains $(find out -type f | wc -l | tr -d ' ') files"

      - name: Wrangler dry-run (bundle validation, no publish)
        working-directory: apps/docs
        run: npx wrangler deploy --dry-run
