name: release-tool-runner

on:
  push:
    tags: ['v*.*.*']

permissions:
  id-token: write    # trusted-publishers to PyPI
  contents: read
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sagewai-tool-runner/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Extract version
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync tool-runner version to SDK tag
        working-directory: packages/tool-runner
        run: |
          python -c "
          import pathlib
          p = pathlib.Path('pyproject.toml')
          content = p.read_text()
          version = '${{ steps.meta.outputs.version }}'
          new = content.replace('version = \"0.1.0\"', f'version = \"{version}\"', 1)
          p.write_text(new)
          "
          sed -i "s/^__version__ = .*/__version__ = \"${{ steps.meta.outputs.version }}\"/" \
              sagewai_tool_runner/__init__.py

      - name: Build wheel
        working-directory: packages/tool-runner
        run: uv build --out-dir dist

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: packages/tool-runner/dist/
          artifact-name: tool-runner-sbom
          format: cyclonedx-json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: packages/tool-runner/dist/*

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1
        with:
          packages-dir: packages/tool-runner/dist
