id: github
version: 0.3.0
title: GitHub — Repository read + write
description: |
  Read repositories, search code, create issues / comments / pull requests,
  and merge pull requests on GitHub via a fine-grained personal access token.
category: developer_tools
kind: http
sandbox_tier: SANDBOXED
exec:
  http:
    base_url: https://api.github.com
    auth:
      kind: bearer
      header: Authorization
      prefix: "Bearer "
    operations:
      get_repo:
        method: GET
        path: /repos/{owner}/{repo}
        input_schema:
          type: object
          required: [owner, repo]
          properties:
            owner: { type: string }
            repo:  { type: string }
        output_schema:
          type: object
          properties:
            id:        { type: integer }
            name:      { type: string }
            full_name: { type: string }
            default_branch: { type: string }
      get_issue:
        method: GET
        path: /repos/{owner}/{repo}/issues/{number}
        input_schema:
          type: object
          required: [owner, repo, number]
          properties:
            owner:  { type: string }
            repo:   { type: string }
            number: { type: integer }
        output_schema:
          type: object
          properties:
            id:       { type: integer }
            number:   { type: integer }
            html_url: { type: string }
            title:    { type: string }
            body:
              type: [string, "null"]
      list_issues:
        method: GET
        path: /repos/{owner}/{repo}/issues
        input_schema:
          type: object
          required: [owner, repo, labels, state, sort, direction, per_page]
          properties:
            owner:     { type: string }
            repo:      { type: string }
            labels:    { type: string }
            state:     { type: string }
            sort:      { type: string }
            direction: { type: string }
            per_page:  { type: integer, minimum: 1, maximum: 100 }
        output_schema:
          type: array
          items:
            type: object
            required: [number, html_url, title]
            properties:
              number:   { type: integer }
              html_url: { type: string }
              title:    { type: string }
              body:
                type: [string, "null"]
              pull_request:
                type: object
      create_issue:
        method: POST
        path: /repos/{owner}/{repo}/issues
        input_schema:
          type: object
          required: [owner, repo, title]
          properties:
            owner: { type: string }
            repo:  { type: string }
            title: { type: string }
            body:  { type: string }
        output_schema:
          type: object
          properties:
            id:       { type: integer }
            number:   { type: integer }
            html_url: { type: string }
      create_comment:
        method: POST
        path: /repos/{owner}/{repo}/issues/{number}/comments
        input_schema:
          type: object
          required: [owner, repo, number, body]
          properties:
            owner:  { type: string }
            repo:   { type: string }
            number: { type: integer }
            body:   { type: string }
        output_schema:
          type: object
          properties:
            id:       { type: integer }
            html_url: { type: string }
            body:     { type: string }
      find_pull_requests:
        method: GET
        path: /repos/{owner}/{repo}/pulls
        input_schema:
          type: object
          required: [owner, repo, head, base, state]
          properties:
            owner: { type: string }
            repo:  { type: string }
            head:  { type: string }
            base:  { type: string }
            state: { type: string }
        output_schema:
          type: array
          items:
            type: object
            required: [number, html_url, head, base]
            properties:
              number:   { type: integer }
              html_url: { type: string }
              head:
                type: object
                required: [ref]
                properties:
                  ref: { type: string }
              base:
                type: object
                required: [ref]
                properties:
                  ref: { type: string }
      create_pull_request:
        method: POST
        path: /repos/{owner}/{repo}/pulls
        input_schema:
          type: object
          required: [owner, repo, title, head, base]
          properties:
            owner: { type: string }
            repo:  { type: string }
            title: { type: string }
            head:  { type: string }
            base:  { type: string }
            body:  { type: string }
        output_schema:
          type: object
          properties:
            id:       { type: integer }
            number:   { type: integer }
            html_url: { type: string }
      get_pull_request:
        method: GET
        path: /repos/{owner}/{repo}/pulls/{number}
        input_schema:
          type: object
          required: [owner, repo, number]
          properties:
            owner:  { type: string }
            repo:   { type: string }
            number: { type: integer }
        output_schema:
          type: object
          required: [number, html_url, state, merged, merge_commit_sha]
          properties:
            number:           { type: integer }
            html_url:         { type: string }
            state:            { type: string }
            merged:           { type: boolean }
            merge_commit_sha:
              type: [string, "null"]
      merge_pull_request:
        method: PUT
        path: /repos/{owner}/{repo}/pulls/{number}/merge
        input_schema:
          type: object
          required: [owner, repo, number, sha]
          properties:
            owner:  { type: string }
            repo:   { type: string }
            number: { type: integer }
            sha:    { type: string, minLength: 40, maxLength: 40 }
        output_schema:
          type: object
          required: [sha, merged]
          properties:
            sha:     { type: string }
            merged:  { type: boolean }
            message: { type: string }
      search_code:
        method: GET
        path: /search/code
        input_schema:
          type: object
          required: [q]
          properties:
            q: { type: string, minLength: 1 }
        output_schema:
          type: object
          properties:
            total_count: { type: integer }
            items:       { type: array }
scopes:
  - network.outbound.fetch
  - secrets.github_token
  - git.write
setup:
  auth_complexity: api_key
  credential_fields:
    - name: GITHUB_TOKEN
      label: "Fine-grained Personal Access Token"
      type: password
      description: "Starts with github_pat_..."
  signup_url: https://github.com/signup
  console_path: "github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens"
  key_format: "github_pat_..."
  test_endpoint:
    operation: get_repo
    expected_status: 200
  body: |
    1. github.com → Settings → Developer settings → Personal access tokens
       → Fine-grained tokens → Generate new token.
    2. Restrict to the repositories Sagewai should access.
    3. Grant these repository permissions:
       - `Contents: Write` (for repository reads and `merge_pull_request`)
       - `Metadata: Read` (for `get_repo`)
       - `Issues: Write` (for `get_issue`, `list_issues`, `create_issue`, and `create_comment`)
       - `Pull requests: Write` (for `create_pull_request`)
    4. Copy the `github_pat_...` token.
    5. Paste into Sagewai → Connections → Tools → Add GitHub.

    If you already registered a read-only token under an earlier batch,
    regenerate with the broader permissions above before the write
    operations will succeed. The "Test" button will surface a 403 if
    your token doesn't have the right permissions.
